name: Feature or rule request
description: A new rule, a change to the layer contract, or a new command
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A project layout or model that shows the case.
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else
      description: Workarounds, how other tools handle it, open questions.
