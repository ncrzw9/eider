name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ci-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # `eider run` drives the DuckDB command line; the end-to-end build tests
      # need a real one, and must not skip here.
      - name: Install the DuckDB command line
        run: |
          curl -sSLf -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          mkdir -p "$HOME/.local/bin"
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo test
        env:
          EIDER_REQUIRE_DUCKDB: "1"
      - run: cargo run --release -- check examples/birds
      # The examples are the house style: every grebe rule, opt-in ones
      # included, must be clean, and every file canonically formatted. grebe
      # is pinned to the version of grebe-syntax the lockfile resolves.
      - name: Examples pass every grebe rule and are formatted
        run: |
          set -euo pipefail
          version=$(grep -A1 '^name = "grebe-syntax"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install --locked grebe --version "=$version"
          grebe check --select ALL examples 2>&1 | tee lint.txt
          grep -q '^0 finding(s)' lint.txt
          grebe format --check examples

