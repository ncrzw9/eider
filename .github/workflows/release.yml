name: Release
run-name: Release ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

# Two ways in: push a v* tag, or run this workflow by hand with the version,
# in which case it tags the commit itself once the checks pass. Either way
# nothing is published until the release environment is approved.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.1)"
        required: true

permissions:
  contents: write

env:
  RUST_VERSION: "1.98.0"
  BIN_NAME: eider
  CARGO_TERM_COLOR: always

jobs:
  # A tag ships only if it names the version Cargo.toml declares and the tree
  # passes the same checks as CI.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component rustfmt,clippy && rustup default ${{ env.RUST_VERSION }}
      - name: Tag matches Cargo.toml
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then tag="v$INPUT_VERSION"; else tag="$GITHUB_REF_NAME"; fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "tag=$tag cargo=$version"
          [ "${tag#v}" = "$version" ]
          if [ -n "$INPUT_VERSION" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo package
      # A tag pushed with the workflow's own token starts no new run, so this
      # run carries on as the release for it.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag -a "$TAG" -m "eider ${TAG#v}" "$GITHUB_SHA"
          git push origin "$TAG"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            aarch64_gnu: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }} (target ${{ matrix.target }})
        shell: bash
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
          rustup default ${{ env.RUST_VERSION }}
          rustup target add ${{ matrix.target }}

      - name: Install musl cross tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install aarch64-linux-gnu cross tools
        if: matrix.aarch64_gnu
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu; then
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not install gcc-aarch64-linux-gnu after 3 attempts" >&2
          exit 1

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          dir="${{ env.BIN_NAME }}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$dir/"
          cp LICENSE README.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "${{ env.BIN_NAME }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "$dir/"
          Copy-Item LICENSE "$dir/"
          Copy-Item README.md "$dir/"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    name: publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts and generate checksums
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} out/ \;
          ( cd out && sha256sum * > SHA256SUMS.txt )
          ls -la out

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" out/* --verify-tag --title "$TAG" --generate-notes

  # Publishing waits on the `release` environment, which requires a manual
  # approval: every tag builds and tests on its own, nothing reaches
  # crates.io until a person approves it. crates.io authenticates with a
  # short-lived OIDC token (trusted publishing), so no registry token is
  # stored anywhere.
  publish:
    name: publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal && rustup default ${{ env.RUST_VERSION }}

      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
